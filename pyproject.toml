[build-system]
requires = ["setuptools==80.10.2", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "lm_eval"
version = "0.4.8"
authors = [
    {name="EleutherAI", email="contact@eleuther.ai"}
]
description = "A framework for evaluating language models"
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.12,<3.13"
license = { "text" = "MIT" }
dependencies = [
    "urllib3==2.7.0",
    "accelerate==1.13.0",
    "evaluate==0.4.6",
    "eval-hub-sdk[adapter]==0.4.0",
    "datasets==4.8.5",
    "jsonlines==4.0.0",
    "numexpr==2.14.1",
    "peft==0.19.1",
    "pybind11==3.0.4",
    "pytablewriter==1.2.1",
    "rouge-score==0.1.2",
    "sacrebleu==2.6.0",
    "scikit-learn==1.9.0",
    "sqlitedict==2.1.0",
    "torch==2.11.0",
    "transformers==4.57.6",
    "zstandard==0.25.0",
    "dill==0.4.1",
    "word2number==1.1",
    "more_itertools==11.1.0",
    "unitxt==1.26.10",
    "jiwer==4.0.0",
    "boto3==1.43.23",
    "olot==0.1.17",
]

[tool.setuptools.packages.find]
include = ["lm_eval*"]

# required to include yaml files in pip installation
[tool.setuptools.package-data]
lm_eval = ["**/*.yaml", "tasks/**/*"]

[project.scripts]
lm-eval = "lm_eval.__main__:cli_evaluate"
lm_eval = "lm_eval.__main__:cli_evaluate"

[project.urls]
Homepage = "https://github.com/EleutherAI/lm-evaluation-harness"
Repository = "https://github.com/EleutherAI/lm-evaluation-harness"

[project.optional-dependencies]
api = [
    "requests==2.34.2",
    "aiohttp==3.14.0",
    "tenacity==9.1.4",
    "tqdm==4.67.3",
    "tiktoken==0.13.0",
]
ifeval = ["langdetect==1.0.9", "immutabledict==4.3.1", "nltk==3.9.4"]
math = ["sympy>=1.12", "antlr4-python3-runtime==4.11", "math_verify[antlr4_11_0]"]
dev = [
    "pytest==8.3.3",
    "pytest-cov==6.0.0",
    "pytest-xdist==3.6.1",
    "pre-commit==4.0.1",
    "mypy==1.13.0",
]
hf_transfer = ["hf-transfer==0.1.9"]
testing = ["pytest==8.3.3", "pytest-cov==6.0.0", "pytest-xdist==3.6.1"]
ibm_watsonx_ai = ["ibm-watsonx-ai==1.4.11"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["lm_eval"]

[tool.ruff.lint.extend-per-file-ignores]
"__init__.py" = ["F401", "F402", "F403"]
"utils.py" = ["F401"]
